services:
  mongo:
    image: mongo:7
    container_name: vidgen-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: vidgen-qdrant
    restart: unless-stopped
    # Published on loopback because the semantic footage indexer runs as a host
    # bun process, not in this network.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image carries no curl, wget or nc — only Debian bash. bash's
      # /dev/tcp speaks the HTTP request itself; /readyz is 200 only once the
      # node has finished loading its collections.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidgen
    restart: unless-stopped
    # HyperFrames renders through a headless Chrome. Docker gives a container
    # 64 MB of /dev/shm by default, which is where Chrome puts its shared
    # rendering buffers — at 1080p a tab exhausts that and dies mid-render.
    shm_size: 1gb
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: vidgen
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENDPOINT: ${ENDPOINT:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Provider credentials. The image has no .env, so these are forwarded
      # from the .env next to this file, which Compose reads by itself.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMMA_API_KEY: ${GEMMA_API_KEY:-}
      PEXELS_API_KEYS: ${PEXELS_API_KEYS:-${PEXELS_API_KEY:-}}
      PIXABAY_API_KEYS: ${PIXABAY_API_KEYS:-${PIXABAY_API_KEY:-}}
      COVERR_API_KEYS: ${COVERR_API_KEYS:-${COVERR_API_KEY:-}}
      TWELVELABS_API_KEYS: ${TWELVELABS_API_KEYS:-${TWELVELABS_API_KEY:-}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    volumes:
      # Generated videos, downloaded materials, uploaded BGM and local clips.
      - ./storage:/app/storage
      # Whisper GGUF models, downloaded on first use.
      - ./models:/app/models

volumes:
  mongo-data:
  qdrant-data:
