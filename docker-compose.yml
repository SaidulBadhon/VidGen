services:
  mongo:
    image: mongo:7
    container_name: moneyprinterturbo-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneyprinterturbo
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: moneyprinterturbo
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENDPOINT: ${ENDPOINT:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      # Generated videos, downloaded materials, uploaded BGM and local clips.
      - ./storage:/app/storage
      # Whisper GGUF models, downloaded on first use.
      - ./models:/app/models

volumes:
  mongo-data:
