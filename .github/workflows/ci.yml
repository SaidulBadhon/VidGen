name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  server:
    name: Server (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: vidgen_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The subtitle renderer measures text with the bundled fonts and the whole
      # pipeline shells out to ffmpeg, so both must be present for the tests.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run --cwd server test

      - name: Build web UI
        run: bun run build

      - name: Verify the server boots
        run: |
          bun server/src/index.ts &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8080/api/v1/health
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy in time"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  python-version:
    name: Python version (archived)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The archived implementation is no longer tested end to end; this only
      # confirms it still parses, so it stays usable as a reference.
      - name: Compile archived sources
        working-directory: python-version
        run: python -m compileall -q app cli.py main.py webui
